<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpegDemuxer PIPELINE_ERROR_READ 验证</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; line-height: 1.5; max-width: 650px; margin: 0 auto; background: #f8fafc; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; border: 1px solid #e2e8f0; }
        #status { font-weight: bold; padding: 12px; border-radius: 6px; background: #f1f5f9; margin-bottom: 16px; color: #334155; text-align: center; }
        .btn-group { display: flex; gap: 12px; margin-bottom: 16px; }
        button { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        video { width: 100%; border-radius: 6px; background: #000; display: block; margin-top: 10px; }
        .log-box { font-family: monospace; font-size: 12px; background: #0f172a; color: #38edf8; padding: 12px; border-radius: 6px; max-height: 280px; overflow-y: auto; white-space: pre-wrap; }
        .err-highlight { color: #f87171; font-weight: bold; }
        .success-highlight { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>
    <h2>FFmpegDemuxer 运行时断流验证</h2>

    <div class="card">
        <div id="status">正在准备 Service Worker 环境...</div>
        
        <div class="btn-group">
            <button class="btn-primary" onclick="playVideo(false)">▶️ 正常播放</button>
            <button class="btn-danger" onclick="playVideo(true)">💥 触发 OnDemuxerError</button>
        </div>

        <div id="videoContainer"></div>
    </div>

    <div class="card">
        <h3>运行与 C++ 报错日志：</h3>
        <div id="log" class="log-box"></div>
    </div>

    <script>
        function log(msg, type = 'info') {
            const logBox = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            let cssClass = '';
            if (type === 'error') cssClass = 'class="err-highlight"';
            if (type === 'success') cssClass = 'class="success-highlight"';
            logBox.innerHTML += `<div ${cssClass}>[${time}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setStatus(text, bg, color = '#000') {
            const el = document.getElementById('status');
            el.innerText = text;
            el.style.backgroundColor = bg;
            el.style.color = color;
        }

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then((reg) => {
                    log('Service Worker 注册成功');
                    navigator.serviceWorker.ready.then(() => {
                        if (!navigator.serviceWorker.controller) {
                            log('正在刷新激活最新 SW...', 'error');
                            window.location.reload();
                            return;
                        }
                        setStatus('✅ 环境准备就绪', '#dcfce7', '#166534');
                    });
                })
                .catch((err) => {
                    log('SW 注册失败: ' + err, 'error');
                });
        }

        function playVideo(shouldError) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = ''; 

            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.crossOrigin = 'anonymous';

            // 绑定 WebAudio 逼迫 Chromium 启用 C++ FFmpegDemuxer
            try {
                const ctx = getAudioContext();
                const source = ctx.createMediaElementSource(video);
                source.connect(ctx.destination);
                log('💡 已接入 WebAudio，强行逼迫 Chromium 启用 FFmpegDemuxer');
            } catch (e) {
                log('⚠️ WebAudio 提示: ' + e.message);
            }

            video.onerror = () => {
                const err = video.error;
                log(`❌ [捕获到 HTML5 MediaError] Code: ${err.code}`, 'error');
                
                if (err.code === 2) {
                    log(`🎯 验证成功！Code 2 (MEDIA_ERR_NETWORK) 精准对应 C++ PIPELINE_ERROR_READ！`, 'success');
                    setStatus('💥 成功捕获到 C++ OnDemuxerError(PIPELINE_ERROR_READ) 抛出的断流错误！', '#fee2e2', '#991b1b');
                } else {
                    log(`⚠️ 捕获到错误 Code: ${err.code}`, 'error');
                }

                if (err.message) {
                    log(`📝 C++ MEDIA_LOG 信息: "${err.message}"`, 'error');
                }
            };

            video.onplaying = () => {
                log('🎬 视频开始正常播放，FFmpegDemuxer 顺利完成 Header 解析进入 kReading 状态！', 'success');
            };

            const timestamp = Date.now();
            video.src = shouldError 
                ? `./mock_video.webm?error=true&t=${timestamp}` 
                : `./mock_video.webm?t=${timestamp}`;

            if (shouldError) {
                log('▶️ 开始测试（裁切只给 150KB 数据，起播后 1 秒强行闭关管道）');
                setStatus('⏳ 正在播放，等待 1 秒后触发 C++ 断流...', '#fef3c7', '#92400e');
            } else {
                log('▶️ 开始测试（正常全量流程）');
                setStatus('⏳ 正在加载正常视频...', '#e0f2fe', '#075985');
            }

            container.appendChild(video);
        }
    </script>
</body>
</html>

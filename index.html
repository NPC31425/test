<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpegDemuxer 测试控制台</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; line-height: 1.5; max-width: 600px; margin: 0 auto; background: #f8fafc; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; border: 1px solid #e2e8f0; }
        #status { font-weight: bold; padding: 12px; border-radius: 6px; background: #f1f5f9; margin-bottom: 16px; color: #334155; text-align: center; }
        .btn-group { display: flex; gap: 12px; margin-bottom: 16px; }
        button { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        video { width: 100%; border-radius: 6px; background: #000; display: block; margin-top: 10px; }
        .log-box { font-family: monospace; font-size: 12px; background: #0f172a; color: #38edf8; padding: 12px; border-radius: 6px; max-height: 220px; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>Demuxer 报错触发控制台</h2>

    <div class="card">
        <div id="status">正在初始化 Service Worker...</div>
        
        <div class="btn-group">
            <button class="btn-primary" onclick="playVideo(false)">▶️ 正常播放</button>
            <button class="btn-danger" onclick="playVideo(true)">💥 模拟中断报错</button>
        </div>

        <div id="videoContainer"></div>
    </div>

    <div class="card">
        <h3>运行日志：</h3>
        <div id="log" class="log-box"></div>
    </div>

    <script>
        function log(msg) {
            const logBox = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${time}] ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setStatus(text, bg, color = '#000') {
            const el = document.getElementById('status');
            el.innerText = text;
            el.style.backgroundColor = bg;
            el.style.color = color;
        }

        // 注册 Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then((reg) => {
                    log('Service Worker 注册成功');
                    navigator.serviceWorker.ready.then(() => {
                        if (!navigator.serviceWorker.controller) {
                            log('激活 Service Worker，刷新页面以接管控制权...');
                            window.location.reload();
                            return;
                        }
                        setStatus('✅ SW 已就绪，请选择测试模式', '#dcfce7', '#166534');
                    });
                })
                .catch((err) => {
                    log('SW 注册失败: ' + err);
                    setStatus('❌ Service Worker 注册失败', '#fee2e2', '#991b1b');
                });
        } else {
            setStatus('❌ 当前环境不支持 Service Worker', '#fee2e2', '#991b1b');
        }

        function playVideo(shouldError) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = ''; // 清空先前的视频容器

            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            
            // 加上时间戳防止 WebView 的 HTTP 强缓存干扰测试
            const timestamp = Date.now();
            const targetUrl = shouldError 
                ? `./mock_video.mp4?error=true&t=${timestamp}` 
                : `./mock_video.mp4?t=${timestamp}`;

            video.src = targetUrl;

            if (shouldError) {
                log('▶️ 请求：./mock_video.mp4?error=true（预定 100KB 断流）');
                setStatus('⏳ 加载中，准备触发断流报错...', '#fef3c7', '#92400e');
            } else {
                log('▶️ 请求：./mock_video.mp4（正常播放）');
                setStatus('⏳ 正在正常加载视频...', '#e0f2fe', '#075985');
            }

            video.onplay = () => log('🎬 <video> 收到 Header 并开始播放');
            
            video.onerror = () => {
                log('❌ <video> 捕获到播放错误');
                setStatus('💥 数据流已切断！OnDataSourceError 已触发', '#fee2e2', '#991b1b');
            };

            video.onended = () => {
                log('✅ 视频完整播放完毕');
                setStatus('✅ 正常播放完成', '#dcfce7', '#166534');
            };

            container.appendChild(video);
        }
    </script>
</body>
</html>
